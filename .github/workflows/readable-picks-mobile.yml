name: Readable pick buttons mobile acceptance
on:
  push:
    branches: ['fix/readable-all-outcomes-20261029']
  pull_request:
    paths:
      - 'index.html'
      - 'tests/easy-play-ui.spec.cjs'
      - '.github/workflows/readable-picks-mobile.yml'
permissions:
  contents: read
jobs:
  readable-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check page and code
        run: |
          node scripts/check-page.mjs
          node --test tests/easy-play.test.mjs tests/multi-source-feed.test.mjs
      - name: Install Chromium browser for acceptance
        run: |
          npm install --no-save @playwright/test@1.61.1
          npx playwright install --with-deps chromium
      - name: Serve this branch without deploying
        run: python3 -m http.server 8000 >/tmp/drive-duel-readable.log 2>&1 &
      - name: Verify 16 options and readable text at mobile widths
        run: npx playwright test tests/easy-play-ui.spec.cjs --workers=1
      - name: Keep screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readable-pick-buttons-mobile
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
