name: Manual isolated browser verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_LARGE_LOAD_TEST: '1'
      RUN_REALTIME_LOAD_PROBE: '0'
      TEST_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.61.1
          npx playwright install --with-deps chromium
      - name: Start local application
        run: python3 -m http.server 8000 > /tmp/drive-duel-server.log 2>&1 &
      - name: Run isolated browser and 100-player mock tests
        run: npx playwright test --grep-invert 'real realtime subscribers receive simulated scoring without polling'
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-browser-test-evidence
          path: |
            playwright-report/
            test-results/
