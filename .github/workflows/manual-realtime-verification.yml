name: Isolated browser verification
on:
  push:
    branches:
      - test/manual-realtime-probe-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_LARGE_LOAD_TEST: '1'
      RUN_REALTIME_LOAD_PROBE: '0'
      TEST_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local database isolation
        run: node --test tests/prepare-local-app.test.cjs
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.61.1
          npx playwright install --with-deps chromium
      - name: Start local application
        run: |
          python3 -m http.server 8000 > /tmp/drive-duel-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/drive-duel-server.log
          exit 1
      - name: Run mocked 100-player load test only
        run: npx playwright test tests/load-simulation.spec.cjs
      - name: Validate 100-player report
        run: node tests/verify-load-report.cjs
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-browser-test-evidence
          path: |
            playwright-report/
            test-results/

  local-realtime-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local Supabase CLI and client
        run: |
          npm install --no-save supabase@2 @supabase/supabase-js@2
          if [ ! -f supabase/config.toml ]; then
            # This repo already has a supabase/ directory containing SQL scripts.
            # The CLI requires --force to initialize inside that existing directory.
            npx supabase init --force
          fi
          mkdir -p supabase/migrations
          cp tests/local-realtime-probe.sql supabase/migrations/20261014000000_local_realtime_probe.sql
      - name: Check local test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          npx supabase --version
          test -f supabase/config.toml
          test -f supabase/migrations/20261014000000_local_realtime_probe.sql
          echo "Docker, CLI, and local migration are available"
      - name: Start ephemeral local Supabase
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/local-supabase
          npx supabase start --exclude studio,imgproxy,mailpit,analytics,vector,supavisor 2>&1 | tee test-results/local-supabase/start.log
      - name: Run real two-client realtime test
        shell: bash
        run: |
          set -euo pipefail
          npx supabase status -o env > /tmp/local-supabase.env
          source /tmp/local-supabase.env
          export TEST_SUPABASE_URL="${API_URL:-}"
          export TEST_SUPABASE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          export TEST_SUPABASE_SERVICE_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          if [[ -z "$TEST_SUPABASE_URL" || -z "$TEST_SUPABASE_ANON_KEY" || -z "$TEST_SUPABASE_SERVICE_KEY" ]]; then
            echo "::error::Local Supabase CLI did not return the expected URL and API keys"
            exit 1
          fi
          case "$TEST_SUPABASE_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "::error::Refusing nonlocal Supabase API URL"; exit 1 ;;
          esac
          mkdir -p test-results/local-supabase
          node tests/local-realtime-transport.cjs 2>&1 | tee test-results/local-supabase/realtime-test.log
      - name: Summarize realtime integration result
        if: always()
        shell: bash
        run: |
          {
            echo "## Local Supabase realtime test"
            if [[ -f test-results/local-supabase/realtime-test.log ]]; then
              if grep -q '^PASS:' test-results/local-supabase/realtime-test.log; then
                echo "Two-client transport check: PASS"
              else
                echo "Two-client transport check: not confirmed"
              fi
              echo "See local-realtime-diagnostics artifact for the complete test output."
            else
              echo "Test did not reach the Node integration step; inspect startup logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Capture local database diagnostics
        if: failure()
        run: |
          mkdir -p test-results/local-supabase
          docker ps -a --format '{{.Names}} {{.Status}}' > test-results/local-supabase/containers.txt || true
          npx supabase status > test-results/local-supabase/status.txt 2>&1 || true
      - name: Upload local realtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-realtime-diagnostics
          path: test-results/local-supabase/
          if-no-files-found: ignore
      - name: Stop ephemeral Supabase
        if: always()
        run: npx supabase stop --no-backup || true
