name: Manual realtime verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  realtime-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: drive-duel-test
    env:
      RUN_REALTIME_LOAD_PROBE: '1'
      TEST_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated test configuration
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
        run: |
          test -n "$TEST_SUPABASE_URL" || { echo 'Missing TEST_SUPABASE_URL in drive-duel-test environment'; exit 1; }
          test -n "$TEST_SUPABASE_ANON_KEY" || { echo 'Missing TEST_SUPABASE_ANON_KEY in drive-duel-test environment'; exit 1; }
          echo 'Isolated test credentials present. The application must also be configured to use this test project.'
          exit 1
      # Intentionally fail closed until the application supports explicit test-project injection.
      # Never execute this against the production database.
