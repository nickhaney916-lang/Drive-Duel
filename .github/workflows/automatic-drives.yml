name: Automatic drive validation
on:
  push:
    branches: ['feature/automatic-drives-20261011', 'feature/queued-picks-20261011', 'feature/unified-picks-20261011', 'feature/tracker-picks-20261011', 'feature/compact-tracker-20261011', 'feature/live-group-scores-20261011', 'feature/visible-room-joins-20261011', 'feature/resume-group-20261011', 'feature/focus-tracker-20261011', 'feature/game-scores-20261011', 'feature/game-players-20261011', 'feature/possession-visuals-20261011', 'feature/pending-possession-recovery-20261011', 'feature/groups-achievements-20261011', 'feature/main-leaderboard-20261011', 'feature/expanded-outcomes-20261012', 'feature/front-page-leaders-20261012', 'feature/simple-front-page-20261012', 'main']
permissions:
  contents: read
jobs:
  automatic-drives:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.61.1
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 > /tmp/drive-duel-server.log 2>&1 &
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-drive-evidence
          path: |
            playwright-report/
            test-results/
