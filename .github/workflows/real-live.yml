name: Real live game validation
on:
  push:
    branches: ['test/live-validation-20261011']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.61.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/real-live.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-live-evidence
          path: |
            playwright-report/
            test-results/
