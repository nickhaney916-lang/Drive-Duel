name: Two browser synchronization
on:
  push:
    branches: ['test/two-browser-sync-20261011']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synchronization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test runner and Chromium
        run: |
          npm install --no-save @playwright/test@1.61.1
          npx playwright install --with-deps chromium
      - name: Run two independent browsers against deployed app
        run: npx playwright test
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-sync-evidence
          path: |
            playwright-report/
            test-results/
