<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

// ============================================
// DRIVE DUEL — SUPABASE-ENABLED GAME SCRIPT
// ============================================

const $ = id => document.getElementById(id);

const SUPABASE_URL =
  "https://qlwotqbqxpgkheitsboe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_t26TKuxteJbxsGkAkGDzeQ_d8oisCzg";

let supabaseClient = null;
let driveDuelUser = null;
let connectionReady = false;

const colors = [
  "#31d58b", "#55a6ff", "#b48aff", "#ffcf66",
  "#ff7777", "#55d5d5", "#ff9b62", "#e78dff"
];

let roomCode = "";
let roomName = "";
let league = "NFL";
let players = [];
let currentPlayerId = "";
let selectedPick = "";
let drive = 1;
let locked = false;
let revealed = false;
let scored = false;
let seconds = 15;
let timerHandle = null;
let feedItems = [];

function makeCode() {
  return Math.random().toString(36)
    .slice(2, 8).toUpperCase().padEnd(6, "X");
}

function makeId() {
  return Math.random().toString(36).slice(2, 10);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

function toast(message) {
  const box = $("toast");
  box.textContent = message;
  box.style.display = "block";
  clearTimeout(toast.handle);
  toast.handle = setTimeout(
    () => box.style.display = "none",
    3500
  );
}

// ============================================
// SUPABASE CONNECTION
// ============================================

async function connectDriveDuel() {
  try {
    if (!window.supabase) {
      throw new Error("Supabase library did not load.");
    }

    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) throw error;

    if (data.session && data.session.user) {
      driveDuelUser = data.session.user;
    } else {
      const { data: loginData, error: loginError } =
        await supabaseClient.auth.signInAnonymously();

      if (loginError) throw loginError;

      driveDuelUser = loginData.user;
    }

    connectionReady = true;

    console.log(
      "Drive Duel connected to Supabase.",
      "User ID:",
      driveDuelUser.id
    );

    toast("Database connected successfully.");

  } catch (error) {
    connectionReady = false;

    console.error(
      "Drive Duel connection error:",
      error.message
    );

    toast("Database connection failed: " + error.message);
  }
}

// Start connecting as soon as the page loads.
connectDriveDuel();

// ============================================
// CREATE AND JOIN ROOMS
// ============================================

async function createRoom() {
  if (!connectionReady) {
    toast("Connecting to the database. Please try again shortly.");
    return;
  }

  const name =
    $("creatorName").value.trim() || "Player 1";

  roomName =
    $("roomName").value.trim() || "Drive Duel Game Night";

  league = $("league").value;

  // This stage still creates a local prototype room.
  // Database room creation will be added after secure
  // room-creation permissions are configured.
  roomCode = makeCode();

  players = [{
    id: makeId(),
    name,
    color: colors[0],
    score: 0,
    pick: "",
    locked: false
  }];

  currentPlayerId = players[0].id;

  drive = 1;
  locked = false;
  revealed = false;
  scored = false;
  selectedPick = "";
  feedItems = [];

  addFeed(
    "Local prototype room created",
    name + " created " + roomName +
    ". The room is not yet shared through the database."
  );

  showGame();

  toast("Game opened. Shared room creation is the next step.");
}

function joinRoom() {
  const name =
    $("joinName").value.trim() || "Player";

  const code =
    $("joinCode").value.trim().toUpperCase();

  if (!code) {
    toast("Enter a room code.");
    return;
  }

  // Cross-device joining is not enabled yet.
  roomCode = code;
  roomName = "Joined Room";
  league = "Practice";

  players = [{
    id: makeId(),
    name,
    color: colors[0],
    score: 0,
    pick: "",
    locked: false
  }];

  currentPlayerId = players[0].id;

  drive = 1;
  locked = false;
  revealed = false;
  scored = false;
  selectedPick = "";
  feedItems = [];

  addFeed(
    "Local preview",
    name + " entered code " + code +
    ". Shared joining is not enabled yet."
  );

  showGame();

  toast("Local preview opened. Shared joining is coming next.");
}

function showGame() {
  $("lobbyScreen").style.display = "none";
  $("gameScreen").style.display = "block";

  $("activeRoomName").textContent = roomName;
  $("activeRoomCode").textContent = roomCode;
  $("leagueBadge").textContent =
    league.toUpperCase() + " · ROOM";

  renderPlayers();
  renderFeed();
  renderDrive();
  startTimer(15);

  history.replaceState(
    null,
    "",
    location.pathname + "?room=" + roomCode
  );
}

function leaveRoom() {
  stopTimer();

  $("gameScreen").style.display = "none";
  $("lobbyScreen").style.display = "grid";

  history.replaceState(null, "", location.pathname);
}

async function copyCode() {
  try {
    await navigator.clipboard.writeText(roomCode);
    toast("Room code copied: " + roomCode);
  } catch {
    toast("Room code: " + roomCode);
  }
}

async function shareInvite() {
  const url = location.href;

  if (navigator.share) {
    try {
      await navigator.share({
        title: "Join my Drive Duel game",
        text: "Drive Duel room code: " + roomCode,
        url
      });
    } catch (error) {
      console.log("Sharing cancelled or unavailable.");
    }
  } else {
    try {
      await navigator.clipboard.writeText(url);
      toast("Invite link copied.");
    } catch {
      toast("Share this room code: " + roomCode);
    }
  }
}

// ============================================
// PREDICTIONS
// ============================================

function choosePick(pick) {
  if (locked || scored) {
    toast("Your pick is locked for this drive.");
    return;
  }

  selectedPick = pick;

  document.querySelectorAll(".choice").forEach(button => {
    button.classList.toggle(
      "selected",
      button.dataset.pick === pick
    );
  });
}

function lockPick() {
  if (locked || scored) {
    toast("Your pick is already locked.");
    return;
  }

  if (!selectedPick) {
    toast("Choose an outcome first.");
    return;
  }

  const player =
    players.find(p => p.id === currentPlayerId);

  if (!player) return;

  player.pick = selectedPick;
  player.locked = true;
  locked = true;

  addFeed(
    "Pick locked",
    player.name + " locked a prediction."
  );

  renderPlayers();
  renderDrive();

  toast("Your prediction is locked.");
}

function revealPicks() {
  revealed = true;

  renderPlayers();
  renderDrive();

  addFeed(
    "Predictions revealed",
    "The local prototype picks are now visible."
  );
}

// ============================================
// SCORING
// ============================================

function scoreDrive() {
  if (scored) {
    toast("This drive has already been scored.");
    return;
  }

  const actual = $("actualOutcome").value;
  let correct = 0;

  players.forEach(player => {
    if (player.pick && player.pick === actual) {
      player.score += 10;
      correct++;
    }
  });

  scored = true;
  revealed = true;

  stopTimer();

  const note = $("driveNote").value.trim();

  addFeed(
    "Drive " + drive + ": " + actual,
    correct + " correct prediction(s) earned 10 points." +
    (note ? " " + note : "")
  );

  renderPlayers();
  renderDrive();

  toast(
    "Drive scored. " + correct +
    " correct prediction(s)."
  );
}

function nextDrive() {
  if (
    !scored &&
    !confirm("This drive has not been scored. Continue anyway?")
  ) {
    return;
  }

  drive++;

  locked = false;
  revealed = false;
  scored = false;
  selectedPick = "";

  players.forEach(player => {
    player.pick = "";
    player.locked = false;
  });

  $("driveNote").value = "";

  document.querySelectorAll(".choice").forEach(button => {
    button.classList.remove("selected");
  });

  addFeed(
    "Drive " + drive + " started",
    "Predictions are open."
  );

  renderPlayers();
  renderDrive();
  startTimer(15);
}

function resetScores() {
  if (!confirm("Reset all scores and return to drive 1?")) {
    return;
  }

  players.forEach(player => {
    player.score = 0;
    player.pick = "";
    player.locked = false;
  });

  drive = 1;
  locked = false;
  revealed = false;
  scored = false;
  selectedPick = "";
  feedItems = [];

  document.querySelectorAll(".choice").forEach(button => {
    button.classList.remove("selected");
  });

  addFeed("Game reset", "All scores reset to zero.");

  renderPlayers();
  renderDrive();
  startTimer(15);
}

function addDemoPlayer() {
  const number = players.length + 1;

  players.push({
    id: makeId(),
    name: "Demo Player " + number,
    color: colors[players.length % colors.length],
    score: 0,
    pick: "",
    locked: false
  });

  renderPlayers();

  addFeed(
    "Player added",
    "Demo Player " + number + " was added locally."
  );
}

// ============================================
// MATCHUP AND DISPLAY
// ============================================

function updateMatchup() {
  const away =
    $("awayInput").value.trim() || "AWAY TEAM";

  const home =
    $("homeInput").value.trim() || "HOME TEAM";

  $("awayTeam").textContent = away;
  $("homeTeam").textContent = home;

  addFeed(
    "Matchup updated",
    away + " vs " + home + "."
  );
}

function renderPlayers() {
  $("playerCount").textContent =
    players.length +
    " PLAYER" +
    (players.length === 1 ? "" : "S");

  const sorted =
    [...players].sort((a, b) => b.score - a.score);

  $("playerList").innerHTML = sorted.map(
    (player, index) => {
      let pickText;

      if (revealed) {
        pickText = escapeHtml(player.pick || "No pick");
      } else if (player.locked) {
        pickText = "Hidden until reveal";
      } else {
        pickText = "Waiting for pick";
      }

      return `
        <div class="player-card"
             style="--player-color:${player.color}">
          <div class="player-top">
            <div>
              <div class="player-name">
                ${escapeHtml(player.name)}
                ${index === 0 && player.score > 0 ? " 👑" : ""}
              </div>
              <div class="small muted">
                ${player.locked ? "PICK LOCKED" : "PICK PENDING"}
              </div>
            </div>
            <div class="player-score">${player.score}</div>
          </div>
          <div class="player-pick">
            Prediction: <strong>${pickText}</strong>
          </div>
        </div>
      `;
    }
  ).join("");
}

function renderDrive() {
  $("driveNumber").textContent = drive;

  $("driveState").textContent =
    scored ? "Drive scored" :
    revealed ? "Predictions revealed" :
    locked ? "Your pick is locked" :
    "Predictions open";

  $("lockButton").disabled = locked || scored;

  $("timer").textContent = seconds;

  $("timer").classList.toggle(
    "urgent",
    seconds <= 5
  );
}

// ============================================
// TIMER AND ACTIVITY FEED
// ============================================

function startTimer(value) {
  stopTimer();

  seconds = value;
  renderDrive();

  timerHandle = setInterval(() => {
    seconds--;

    if (seconds <= 0) {
      seconds = 0;
      stopTimer();

      addFeed(
        "Timer ended",
        "The prediction timer reached zero."
      );
    }

    renderDrive();
  }, 1000);
}

function stopTimer() {
  if (timerHandle) {
    clearInterval(timerHandle);
    timerHandle = null;
  }
}

function addFeed(title, detail) {
  feedItems.unshift({ title, detail });
  feedItems = feedItems.slice(0, 25);

  renderFeed();
}

function renderFeed() {
  $("feed").innerHTML = feedItems.map(item => `
    <div class="feed-item">
      <strong>${escapeHtml(item.title)}</strong>
      ${escapeHtml(item.detail)}
    </div>
  `).join("") ||
  '<div class="feed-item">No activity yet.</div>';
}

// ============================================
// RESTORE ROOM CODE FROM INVITE LINK
// ============================================

const requestedRoom =
  new URLSearchParams(location.search).get("room");

if (requestedRoom) {
  $("joinCode").value = requestedRoom.toUpperCase();
}

</script>
