<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drive Duel - Connection Test</title>  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #10131c;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      max-width: 500px;
      margin: 30px auto;
      padding: 24px;
      background: #1c2230;
      border-radius: 16px;
    }

    h1 {
      color: #63a4ff;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #63a4ff;
      color: #10131c;
      font-size: 17px;
      font-weight: bold;
    }

    #status {
      padding: 15px;
      background: #10131c;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
  </style></head><body>
  <div class="card">
    <h1>🏈 Drive Duel</h1><h2>Supabase Connection Test</h2>

<p>This page checks whether Drive Duel can connect to its database.</p>

<p id="status">Ready. Tap the button below to begin.</p>

<button id="testButton" onclick="testConnection()">
  Test Supabase Connection
</button>

  </div>  <script>
    const SUPABASE_URL =
      "https://qlwotqbqxpgkheitsboe.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_t26TKuxteJbxsGkAkGDzeQ_d8oisCzg";

    const statusBox = document.getElementById("status");
    const testButton = document.getElementById("testButton");

    async function testConnection() {
      testButton.disabled = true;
      statusBox.textContent = "Step 1 of 3: Loading Supabase...";

      try {
        if (!window.supabase) {
          await new Promise((resolve, reject) => {
            const script = document.createElement("script");

            script.src =
              "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

            script.onload = resolve;

            script.onerror = () => reject(
              new Error(
                "Could not load Supabase. Check your internet connection."
              )
            );

            document.head.appendChild(script);
          });
        }

        statusBox.textContent =
          "Step 2 of 3: Connecting to your Supabase project...";

        const client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        const { data, error } =
          await client.auth.signInAnonymously();

        if (error) {
          throw new Error("Sign-in failed: " + error.message);
        }

        if (!data || !data.user) {
          throw new Error("No user session was returned.");
        }

        statusBox.textContent =
          "Step 3 of 3: Checking the database...";

        const { error: databaseError } =
          await client.from("rooms").select("id").limit(1);

        if (databaseError) {
          statusBox.textContent =
            "SIGN-IN WORKED, BUT DATABASE ACCESS FAILED.\n\n" +
            databaseError.message;

          return;
        }

        statusBox.textContent =
          "SUCCESS!\n\n" +
          "Supabase connection is working.\n\n" +
          "Anonymous sign-in: PASSED\n" +
          "Database request: PASSED\n\n" +
          "Drive Duel is connected to Supabase.";

      } catch (error) {
        statusBox.textContent =
          "CONNECTION TEST FAILED\n\n" +
          (error.message || String(error));
      } finally {
        testButton.disabled = false;
      }
    }
  </script></body>
</html>
